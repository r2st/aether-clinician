# Reverse proxy for Aether Clinician (production reference).
events {}

http {
  upstream api { server api:8000; }
  upstream web { server web:3000; }

  server {
    listen 80;
    server_name _;

    # Security headers (defense in depth; the API also sets these).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 25m;  # document uploads (API enforces 20 MB)

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://api;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }
  }
}
